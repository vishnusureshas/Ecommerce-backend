# Local stack: API + MongoDB as a single-node replica set.
# Replica-set mode is REQUIRED for order transactions (see README).
# No secrets are stored here: runtime config comes from .env (gitignored).
# Copy .env.example to .env and set values before the first `docker compose up`.
name: ecommerce-api

services:
  mongo:
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      # Host port 27018 avoids clashing with a local mongod on 27017.
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # One-shot replica-set initiation; exits once mongo is primary.
  rs-init:
    image: mongo:8
    depends_on:
      mongo:
        condition: service_healthy
    command: ["mongosh", "--host", "mongo", "--quiet", "--eval", "try { rs.initiate() } catch (e) { if (!/already/i.test(e.message)) throw e }"]
    restart: "no"

  api:
    build: .
    ports:
      # Host port 5010 avoids clashing with other local services.
      - "5010:5000"
    env_file:
      - .env
    environment:
      # Compose networking: talk to the bundled mongo, not localhost/Atlas.
      MONGODB_URI: mongodb://mongo:27017/ecommerce_api?replicaSet=rs0
      # Containers run as production even if the local .env says development.
      NODE_ENV: production
    depends_on:
      mongo:
        condition: service_healthy
      rs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+(process.env.PORT||5000)+'/health').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  mongo-data:
